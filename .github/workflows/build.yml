name: Build extension
on:
  push:
    branches: [feat/remaining-time]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dev
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist
